[package]
name = "mutsura-api"
version = "0.2.1"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mongodb = {version = "3", features = ["sync"]}
chrono = {version = "0.4", features = ["serde"]}
axum = "0.8.1"
serde_derive = "1.0"
tower = "0.5"
tokio = {version = "1", features = ["full"]}
dotenv = "0.15"
mockall = "0.13.1"
async-trait = "0.1.86"
http = "1.2.0"
futures = "0.3.31"
bson = { version = "2.15.0", features = ["chrono-0_4"] }
tower-http = { version = "0.6.6", features = ["cors"] }
jsonwebtoken = "9.3.1"
uuid = { version = "1.10.0", features = ["v4", "serde"] }
axum-extra = { version = "0.10.1", features = ["cookie", "typed-header"] }
clap = { version = "4.5.54", features = ["derive"] }
password-auth = "1.0.0"
pulldown-cmark = "0.13.3"
time = "0.3.45"

[[bin]]
name="mutsura"
path="src/main.rs"
